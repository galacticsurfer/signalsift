[project]
name = "signalsift"
version = "0.1.0"
description = "Local-first observability intelligence MCP server: CloudWatch logs -> deterministic reduction -> local LLM -> compact incident report"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "boto3>=1.34.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "click>=8.1.0",
]

# Uncomment and fill in once the GitHub remote exists:
# [project.urls]
# Repository = "https://github.com/OWNER/signalsift"
# Issues = "https://github.com/OWNER/signalsift/issues"

[project.scripts]
signalsift = "signalsift.main:cli"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/signalsift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
